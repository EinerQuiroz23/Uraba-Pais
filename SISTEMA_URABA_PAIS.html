    // --- APLICACIÓN PRINCIPAL REACT ---
    function App() {
      // Estado de Base de Datos
      const [db, setDb] = useState(() => {
        const local = localStorage.getItem('uraba_hackathon_db');
        if (local) {
          try { return JSON.parse(local); } catch(e) {}
        }
        return INITIAL_SEED;
      });

      useEffect(() => {
        localStorage.setItem('uraba_hackathon_db', JSON.stringify(db));
      }, [db]);

      const [activeTab, setActiveTab] = useState('guia_flujo');
      const [selectedBenId, setSelectedBenId] = useState('BEN-001');
      const [currentRole, setCurrentRole] = useState('Administrador');
      const [highContrast, setHighContrast] = useState(false);

      // --- MÓDULO 1: BÚSQUEDA Y REGISTRO ---
      const [searchQuery, setSearchQuery] = useState('');
      const [filterMuni, setFilterMuni] = useState('Todos');
      const [showRegisterModal, setShowRegisterModal] = useState(false);
      const [dupAlert, setDupAlert] = useState(null);

      const [formBen, setFormBen] = useState({
        nombres: '',
        apellidos: '',
        tipo_documento: 'CC',
        numero_documento: '',
        fecha_nacimiento: '',
        edad: '',
        genero: 'Femenino',
        telefono: '',
        municipio: 'Apartadó',
        direccion_comunidad: '',
        condicion_poblacional: 'Víctima del conflicto armado',
        discapacidad: 'Ninguna',
        autorizacion_datos: false,
        familiares: []
      });

      const [newFam, setNewFam] = useState({ nombres: '', parentesco: 'Hijo/a', edad: '', documento: '', observaciones: '' });

      // Verificación reactiva anti-duplicados
      useEffect(() => {
        if (formBen.numero_documento && formBen.numero_documento.trim().length >= 4 && formBen.tipo_documento !== 'SIN_DOCUMENTO') {
          const doc = formBen.numero_documento.trim().toLowerCase();
          const match = db.beneficiarios.find(b => 
            b.tipo_documento === formBen.tipo_documento && 
            b.numero_documento && 
            b.numero_documento.trim().toLowerCase() === doc
          );
          if (match) {
            setDupAlert({
              type: 'error',
              message: `¡ALERTA REGLA ANTI-DUPLICADOS! Ya existe un registro con el documento ${formBen.tipo_documento} ${formBen.numero_documento}.`,
              existing: match
            });
          } else {
            setDupAlert(null);
          }
        } else {
          setDupAlert(null);
        }
      }, [formBen.tipo_documento, formBen.numero_documento, db.beneficiarios]);

      const handleAddFamiliarToForm = () => {
        if (!newFam.nombres.trim()) return;
        setFormBen(prev => ({
          ...prev,
          familiares: [...prev.familiares, { ...newFam, id: `fam-${Date.now()}` }]
        }));
        setNewFam({ nombres: '', parentesco: 'Hijo/a', edad: '', documento: '', observaciones: '' });
      };

      const handleRegisterBeneficiary = (e) => {
        e.preventDefault();
        if (!formBen.autorizacion_datos) {
          alert('Requisito Obligatorio: Debe registrar la autorización para el tratamiento de datos personales (Habeas Data).');
          return;
        }
        if (dupAlert && dupAlert.type === 'error') {
          alert('Bloqueado: La persona ya existe con ese documento de identidad.');
          return;
        }

        const nextSeq = db.beneficiarios.length + 1;
        const seqStr = String(nextSeq).padStart(4, '0');
        const codigo_interno = `URB-2026-${seqStr}`;
        const nuevo = {
          ...formBen,
          id: `BEN-${seqStr}`,
          codigo_interno,
          fecha_registro: new Date().toISOString()
        };

        setDb(prev => ({
          ...prev,
          beneficiarios: [nuevo, ...prev.beneficiarios]
        }));

        setShowRegisterModal(false);
        setSelectedBenId(nuevo.id);
        setActiveTab('ficha360');
        alert(`¡Beneficiario registrado exitosamente! Código Inmutable Asignado: ${codigo_interno}`);
      };

      // --- MÓDULO 2: VINCULACIÓN ---
      const [showVincModal, setShowVincModal] = useState(false);
      const [formVinc, setFormVinc] = useState({
        beneficiario_id: 'BEN-001',
        programa_id: 'PROG-01',
        fecha_vinculacion: new Date().toISOString().split('T')[0],
        estado: 'inscrito',
        observaciones: ''
      });

      const handleCreateVinculacion = (e) => {
        e.preventDefault();
        const ben = db.beneficiarios.find(b => b.id === formVinc.beneficiario_id);
        const prog = db.programas.find(p => p.id === formVinc.programa_id);
        if (!ben || !prog) return;

        const newVinc = {
          id: `VINC-${String(db.vinculaciones.length + 1).padStart(3, '0')}`,
          beneficiario_id: ben.id,
          codigo_interno: ben.codigo_interno,
          programa_id: prog.id,
          programa_nombre: prog.nombre,
          linea_trabajo: prog.linea_trabajo,
          fecha_vinculacion: formVinc.fecha_vinculacion,
          estado: formVinc.estado,
          observaciones: formVinc.observaciones
        };

        setDb(prev => ({ ...prev, vinculaciones: [newVinc, ...prev.vinculaciones] }));
        setShowVincModal(false);
        alert('Beneficiario vinculado exitosamente.');
      };

      const handleUpdateEstadoVinc = (vincId, newEstado) => {
        setDb(prev => ({
          ...prev,
          vinculaciones: prev.vinculaciones.map(v => v.id === vincId ? { ...v, estado: newEstado } : v)
        }));
      };

      // --- MÓDULO 3: ATENCIÓN Y SEGUIMIENTO ---
      const [tabAtencionSub, setTabAtencionSub] = useState('atenciones');
      const [showAtenModal, setShowAtenModal] = useState(false);
      const [showSegModal, setShowSegModal] = useState(false);

      const [formAten, setFormAten] = useState({
        beneficiario_id: 'BEN-001',
        fecha: new Date().toISOString().split('T')[0],
        tipo_atencion: 'Entrega de Kit de Habitabilidad',
        linea_trabajo: 'Asistencia humanitaria y protección',
        descripcion: '',
        responsable: 'Laura Carmona',
        entidad: 'COOPI',
        resultado: 'Firma a satisfacción',
        remision: 'Ninguna'
      });

      const [formSeg, setFormSeg] = useState({
        beneficiario_id: 'BEN-001',
        fecha: new Date().toISOString().split('T')[0],
        avance_novedad: '',
        observaciones: '',
        accion_pendiente: '',
        proximo_contacto: '',
        estado_pendiente: 'pendiente'
      });

      const handleCreateAtencion = (e) => {
        e.preventDefault();
        const ben = db.beneficiarios.find(b => b.id === formAten.beneficiario_id);
        const newA = {
          ...formAten,
          id: `ATEN-${String(db.atenciones.length + 1).padStart(3, '0')}`,
          codigo_interno: ben ? ben.codigo_interno : ''
        };
        setDb(prev => ({ ...prev, atenciones: [newA, ...prev.atenciones] }));
        setShowAtenModal(false);
        alert('Atención registrada con éxito.');
      };

      const handleCreateSeguimiento = (e) => {
        e.preventDefault();
        const ben = db.beneficiarios.find(b => b.id === formSeg.beneficiario_id);
        const newS = {
          ...formSeg,
          id: `SEG-${String(db.seguimientos.length + 1).padStart(3, '0')}`,
          codigo_interno: ben ? ben.codigo_interno : ''
        };
        setDb(prev => ({ ...prev, seguidores: [newS, ...prev.seguimientos], seguimientos: [newS, ...prev.seguimientos] }));
        setShowSegModal(false);
        alert('Seguimiento registrado con compromiso pendiente.');
      };

      const handleToggleSeguimiento = (id) => {
        setDb(prev => ({
          ...prev,
          seguimientos: prev.seguimientos.map(s => s.id === id ? {
            ...s,
            estado_pendiente: s.estado_pendiente === 'pendiente' ? 'completado' : 'pendiente'
          } : s)
        }));
      };

      // --- MÓDULO 4: CÁLCULO DE MÉTRICAS DINÁMICAS (REGLA DE CONTEO) ---
      const metricas = useMemo(() => {
        const unicos = new Set(db.beneficiarios.map(b => b.codigo_interno)).size;
        const totalVinc = db.vinculaciones.length;
        const totalAten = db.atenciones.length;
        const totalPend = db.seguimientos.filter(s => s.estado_pendiente === 'pendiente').length;

        const porMunicipio = { Apartadó: 0, Turbo: 0, Necoclí: 0, 'Otro Urabá': 0 };
        db.beneficiarios.forEach(b => {
          if (porMunicipio[b.municipio] !== undefined) porMunicipio[b.municipio]++;
          else porMunicipio['Otro Urabá']++;
        });

        const porLinea = {
          'Asistencia humanitaria y protección': { participaciones: 0, atenciones: 0 },
          'Salud y bienestar': { participaciones: 0, atenciones: 0 },
          'Integración socioeconómica y cohesión social': { participaciones: 0, atenciones: 0 }
        };

        db.vinculaciones.forEach(v => {
          if (porLinea[v.linea_trabajo]) porLinea[v.linea_trabajo].participaciones++;
        });
        db.atenciones.forEach(a => {
          if (porLinea[a.linea_trabajo]) porLinea[a.linea_trabajo].atenciones++;
        });

        return { unicos, totalVinc, totalAten, totalPend, porMunicipio, porLinea };
      }, [db]);

      // Ficha seleccionada
      const currentBeneficiario = db.beneficiarios.find(b => b.id === selectedBenId) || db.beneficiarios[0];
      const vincsBeneficiario = db.vinculaciones.filter(v => v.beneficiario_id === currentBeneficiario?.id);
      const atenBeneficiario = db.atenciones.filter(a => a.beneficiario_id === currentBeneficiario?.id);
      const segBeneficiario = db.seguimientos.filter(s => s.beneficiario_id === currentBeneficiario?.id);

      // Exportar CSV
      const handleExportCSV = () => {
        const rows = [
          ['Reporte Oficial del Proyecto URABÁ-PAÍS'],
          ['Fecha', new Date().toLocaleString()],
          [],
          ['INDICADOR', 'CANTIDAD'],
          ['Beneficiarios Únicos', metricas.unicos],
          ['Participaciones Totales', metricas.totalVinc],
          ['Atenciones Entregadas', metricas.totalAten],
          ['Seguimientos Pendientes', metricas.totalPend],
          [],
          ['MUNICIPIO', 'BENEFICIARIOS ÚNICOS'],
          ...Object.entries(metricas.porMunicipio).map(([m, c]) => [m, c])
        ];
        const csvContent = 'data:text/csv;charset=utf-8,' + rows.map(e => e.join(',')).join('\n');
        const link = document.createElement('a');
        link.setAttribute('href', encodeURI(csvContent));
        link.setAttribute('download', `reporte_uraba_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className={`min-h-screen flex flex-col ${highContrast ? 'bg-black text-yellow-300' : 'bg-slate-50 text-slate-800'}`}>
          {/* HEADER PRINCIPAL */}
          <header className={`border-b sticky top-0 z-40 shadow-sm ${highContrast ? 'bg-black border-yellow-400' : 'bg-white border-slate-200'}`}>
            <div className="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 text-xs border-b border-slate-100">
              <div className="flex items-center gap-2 font-bold text-sky-800 text-sm">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>PROYECTO URABÁ-PAÍS</span>
                <span className="text-slate-300 font-normal">|</span>
                <span className="hidden md:inline text-slate-500 font-normal">COOPI · HIAS · FADV · Humanity & Inclusion (AICS)</span>
              </div>

              <div className="flex items-center gap-3">
                <div className="flex items-center gap-1.5 bg-slate-100 rounded-lg px-2 py-1">
                  <span className="font-semibold text-slate-600">Rol:</span>
                  <select
                    value={currentRole}
                    onChange={(e) => setCurrentRole(e.target.value)}
                    className="bg-transparent font-bold text-slate-800 focus:outline-none cursor-pointer"
                  >
                    <option value="Administrador">Administrador</option>
                    <option value="Funcionario de Campo">Funcionario de Campo</option>
                    <option value="Consulta / Auditor">Consulta (Anonimizada)</option>
                  </select>
                </div>

                <button
                  onClick={() => setHighContrast(!highContrast)}

                    >
                      {db.beneficiarios.map(b => (
                        <option key={b.id} value={b.id}>{b.codigo_interno} - {b.nombres} {b.apellidos}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">Tipo de Ayuda Entregada</label>
                    <input
                      type="text"
                      required
                      value={formAten.tipo_atencion}
                      onChange={(e) => setFormAten({ ...formAten, tipo_atencion: e.target.value })}
                      className="w-full p-2 border rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">Descripción Breve</label>
                    <textarea
                      required
                      rows="2"
                      value={formAten.descripcion}
                      onChange={(e) => setFormAten({ ...formAten, descripcion: e.target.value })}
                      className="w-full p-2 border rounded-xl"
                    ></textarea>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold block mb-1">Responsable</label>
                      <input
                        type="text"
                        value={formAten.responsable}
                        onChange={(e) => setFormAten({ ...formAten, responsable: e.target.value })}
                        className="w-full p-2 border rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Entidad</label>
                      <select
                        value={formAten.entidad}
                        onChange={(e) => setFormAten({ ...formAten, entidad: e.target.value })}
                        className="w-full p-2 border rounded-xl"
                      >
                        <option value="COOPI">COOPI</option>
                        <option value="HIAS">HIAS</option>
                        <option value="FADV">FADV</option>
                        <option value="HI">HI</option>
                      </select>
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={() => setShowAtenModal(false)} className="px-3 py-1.5 border rounded-xl">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-emerald-600 text-white rounded-xl font-bold">Guardar Atención</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL REGISTRO SEGUIMIENTO */}
          {showSegModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">Añadir Seguimiento (Avance & Tarea)</h3>
                  <button onClick={() => setShowSegModal(false)}>✕</button>
                </div>
                <form onSubmit={handleCreateSeguimiento} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold block mb-1">Beneficiario</label>
                    <select
                      value={formSeg.beneficiario_id}
                      onChange={(e) => setFormSeg({ ...formSeg, beneficiario_id: e.target.value })}
                      className="w-full p-2 border rounded-xl"
                    >
                      {db.beneficiarios.map(b => (
                        <option key={b.id} value={b.id}>{b.codigo_interno} - {b.nombres} {b.apellidos}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">Avance, Cambio o Novedad Observada</label>
                    <textarea
                      required
                      rows="2"
                      value={formSeg.avance_novedad}
                      onChange={(e) => setFormSeg({ ...formSeg, avance_novedad: e.target.value })}
                      className="w-full p-2 border rounded-xl"
                    ></textarea>
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">Acción Pendiente (Compromiso)</label>
                    <input
                      type="text"
                      required
                      value={formSeg.accion_pendiente}
                      onChange={(e) => setFormSeg({ ...formSeg, accion_pendiente: e.target.value })}
                      className="w-full p-2 border rounded-xl"
                      placeholder="Ej: Cita de control o entrega de certificación"
                    />
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">Fecha Próximo Contacto</label>
                    <input
                      type="date"
                      value={formSeg.proximo_contacto}
                      onChange={(e) => setFormSeg({ ...formSeg, proximo_contacto: e.target.value })}
                      className="w-full p-2 border rounded-xl"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={() => setShowSegModal(false)} className="px-3 py-1.5 border rounded-xl">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-teal-600 text-white rounded-xl font-bold">Guardar Seguimiento</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-white border-t py-4 text-center text-xs text-slate-400 no-print">
            Proyecto URABÁ-PAÍS · Prototipo Funcional de Gestión y Seguimiento de Beneficiarios (Hackathon 12 Horas)
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
